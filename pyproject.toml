[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-panel"
version = "0.3.19"
description = "Local web panel for an LLM server: systemd service status and control, GPU/RAM/CPU/disk summary, journals with secret masking, action audit"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "D-Stepenko" },
]
keywords = ["llm", "systemd", "nvidia", "vllm", "llama-cpp", "web-panel", "fastapi"]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Environment :: Web Environment",
    "Environment :: Console",
    "Topic :: System :: Systems Administration",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "fastapi>=0.162,<1",
    "starlette>=1.3.1,<2",   # CVE-2025-54121/GHSA-2c2j-9gv5-cj73 + advisories 2026 (аудит №1)
    "python-multipart>=0.0.31",
    "uvicorn[standard]>=0.34,<1",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "argon2-cffi>=23.1",
    "psutil>=6.0",
    "nvidia-ml-py>=12.560",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
llm-panel = "llm_panel.cli:main"

[tool.setuptools.packages.find]
include = ["llm_panel*"]

[tool.setuptools.package-data]
llm_panel = [
    "templates/*.html",
    "static/*",
    "*.sh",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
