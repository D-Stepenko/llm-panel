{% extends "base.html" %}
{% block title %}Логи {{ svc.unit }} — llm-panel{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <div class="eyebrow"><span class="live-dot" style="background: var(--amber)"></span>Journald</div>
    <h1>Логи: {{ svc.name }}</h1>
    <p class="subtitle"><code>{{ svc.unit }}</code> — последние {{ lines }} строк журнала.</p>
  </div>
</div>
{% if err %}<div class="notice err">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
  <span>{{ err }}</span></div>{% endif %}

<div class="logs-controls">
  <form method="get" action="/services/{{ svc.id }}/logs">
    <label>Строк:
      <select name="lines">
        {% for n in [50, 200, 500, 1000] +%}
        <option value="{{ n }}" {{ 'selected' if lines == n else '' }}>{{ n }}</option>
        {% endfor %}
      </select>
    </label>
    <button class="btn">Показать</button>
  </form>
  <a class="btn" href="/services/{{ svc.id }}/logs/download?lines={{ lines }}">Скачать</a>
  <button id="follow-btn" type="button" class="btn">Поток</button>
  <label>Фильтр: <input id="log-filter" type="text" value="{{ filt }}"></label>
</div>

<pre id="log" class="logview" data-stream="/services/{{ svc.id }}/logs/stream?lines=50">{{ text }}</pre>
<script src="/static/logs.js" defer></script>
{% endblock %}
