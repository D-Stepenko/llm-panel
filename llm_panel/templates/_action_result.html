{% extends "base.html" %}
{% block title %}{{ t('res_success') if ok else t('res_error') }} — llm-panel{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <div class="eyebrow">{{ t('res_success') if ok else t('res_error') }}</div>
    <h1>{{ t('res_done') if ok else t('res_error') }}</h1>
  </div>
</div>
<div class="notice {{ 'ok' if ok else 'err' }}">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
    {% if ok %}<path d="M20 6 9 17l-5-5"/>{% else %}<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>{% endif %}
  </svg>
  <span id="flash">{{ message }}</span>
</div>
<p class="settings-links"><a class="btn" href="/">{{ t('back_status') }}</a></p>
{% endblock %}
