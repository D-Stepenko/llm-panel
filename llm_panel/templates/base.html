<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}llm-panel{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.ico">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body data-csrf="{{ csrf }}">
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <div><div class="brand-name">llm-panel</div><div class="version">VERSION {{ version | default('0.1.0') }}</div></div>
    </div>
    <nav class="nav" aria-label="Основная навигация">
      <a class="nav-btn {{ 'active' if request.url.path == '/' }}" href="/">Статусы</a>
      <a class="nav-btn {{ 'active' if request.url.path == '/audit' }}" href="/audit">Аудит</a>
    </nav>
    <div class="top-spacer"></div>
    {% block topbar_actions %}{% endblock %}
    {% if username %}
    <div class="user-area">
      <div class="avatar">{{ (username[:2] or 'AD') | upper }}</div>
      <div class="user-details"><div class="user-name">{{ username }}</div><div class="user-role">Администратор</div></div>
      <form method="post" action="/logout" class="logout-wrap">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <button type="submit" class="logout" aria-label="Выйти" title="Выйти"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 17l5-5-5-5M15 12H3"/><path d="M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6"/></svg></button>
      </form>
    </div>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</div>
<script src="/static/app.js" defer></script>
</body>
</html>
